name: Deploy GitHub Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - refresh-marketshare
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch marketshare data
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-marketshare]')) }}
        run: npm run fetch:data

      - name: Build static site
        run: npm run build

      - name: Restore published data
        if: ${{ github.event_name != 'schedule' && github.event_name != 'repository_dispatch' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-marketshare]')) }}
        run: npm run restore:published-data

      - name: Optimize static JSON
        run: npm run optimize:data

      - name: Verify performance budget
        run: npm run check:performance

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
